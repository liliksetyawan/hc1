sonar.organization=liliksetyawan
sonar.projectKey=liliksetyawan_hc1

# relative paths to source directories. More details and properties are described
# at https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-scope/
sonar.sources=.
sonar.exclusions=backend-skill-new/**

sonar.go.coverage.reportPaths=coverage.out

# Go's coverage tooling never instruments _test.go files themselves (only the
# production code they exercise), so without this, every line of every new
# test file counts as "new code requiring coverage" and can never be
# satisfied — this excludes test files from the coverage requirement
# specifically, without excluding them from other checks (bugs, duplication).
sonar.coverage.exclusions=**/*_test.go
